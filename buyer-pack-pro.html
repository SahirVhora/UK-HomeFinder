<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Pack Pro - UK Home Intelligence Pro</title>
<meta name="description" content="Generate a buyer decision pack from UK Home Intelligence Pro data.">
<style>
:root{--bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd4;--border2:#ccc8be;--text:#1a1815;--muted:#6b6660;--accent:#1a5c3a;--blue:#1751a8;--warn:#8a4a00;--danger:#8b1c1c;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:1120px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:30px;margin:0}h2{font-size:16px;margin:0 0 10px}.muted{color:var(--muted)}a{color:var(--blue);text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(360px,.8fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}.stat strong{display:block;font-size:25px}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:7px 0;font-size:14px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:var(--radius);padding:10px 14px;background:var(--accent);color:white;font-weight:800;cursor:pointer}button.secondary{background:var(--blue)}textarea{width:100%;min-height:560px;border:1px solid var(--border2);border-radius:var(--radius);padding:12px;background:var(--surface);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}.warn{border:1px solid #e7c56a;background:#fff6dc;color:#744500;border-radius:var(--radius);padding:10px;margin-bottom:12px;font-size:14px}@media(max-width:880px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:24px}textarea{min-height:420px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Buyer Pack Pro</h1>
      <div class="muted">Client/family/broker-ready export from the existing HomeFinder local data.</div>
    </div>
    <div class="actions">
      <a class="pill" href="./home-intelligence-pro.html">Home Intelligence Pro</a>
      <a class="pill" href="./index.html">Open tracker</a>
      <a class="pill" href="./decision-engine.html">Decision Engine</a>
    </div>
  </div>

  <div id="empty" class="warn" style="display:none">No tracker data found yet. Add properties or budget details in the current tracker first, then return here.</div>

  <div class="grid">
    <section class="card">
      <h2>Pack Summary</h2>
      <div class="stats" id="stats"></div>
      <div class="rows" id="summaryRows"></div>
      <div class="buttons">
        <button onclick="copyPack()">Copy pack</button>
        <button class="secondary" onclick="downloadPack()">Download Markdown</button>
        <button class="secondary" onclick="refreshPack()">Refresh from tracker</button>
      </div>
    </section>

    <section class="card">
      <h2>Generated Pack</h2>
      <textarea id="pack" spellcheck="false"></textarea>
    </section>
  </div>
</div>

<script>
const STORAGE_KEY="uk-home-hub";
const CHECKLIST_IDS={finance:["aip","deposit","payslips","bankstat","advisor"],schools:["schools-checked","council-call","school-timeline"],legal:["solicitor-shortlist","solicitor-instructed","id-docs"],research:["land-registry","survey-type","surveyor-quotes","flood-check","epc-check"],offer:["offer-strategy","buildings-ins"]};
let appData={};
function money(v){return v?"GBP "+Number(v).toLocaleString("en-GB"):"Not set"}
function scoreProp(p){const scores=p.scores||{};const weights={schools:2,transport:1.5,price:1.5,condition:1,size:1,location:1,garden:.75,broadband:.5};let total=0,max=0;Object.entries(weights).forEach(([k,w])=>{total+=(Number(scores[k])||0)*w;max+=10*w});return max?Math.round(total/max*100):0}
function readiness(){const checklist=appData.checklist||{};const all=Object.values(CHECKLIST_IDS).flat();const done=all.filter(id=>checklist[id]).length;return{done,total:all.length,pct:all.length?Math.round(done/all.length*100):0}}
function load(){try{appData=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{appData={}}if(!appData.properties)appData.properties=[];if(!appData.budget)appData.budget={};if(!appData.checklist)appData.checklist={};if(!appData.settings)appData.settings={}}
function topProperties(){return [...(appData.properties||[])].sort((a,b)=>scoreProp(b)-scoreProp(a)).slice(0,5)}
function missingActions(r){const actions=[];const c=appData.checklist||{};if(!c.aip)actions.push("Get or refresh Mortgage in Principle (AIP).");if(!c["solicitor-shortlist"])actions.push("Shortlist and pre-instruct conveyancing solicitor.");if(!c["schools-checked"])actions.push("Run Area Intelligence for target postcodes and verify school catchments.");if(!appData.properties?.length)actions.push("Add at least one property to the tracker.");if(!appData.budget?.maxprice)actions.push("Set max budget and deposit in Budget & SDLT.");if(r.pct<70)actions.push("Finish readiness checklist before making time-sensitive offers.");return actions}
function buildPack(){const r=readiness();const props=topProperties();const budget=appData.budget||{};const settings=appData.settings||{};const generated=new Date().toLocaleString("en-GB");const lines=["# UK Home Intelligence Pro - Buyer Pack","",`Generated: ${generated}`,`Search label: ${settings.name||"Not set"}`,`Target area: ${settings.area||"Not set"}`,"","## Budget","",`- Max property price: ${money(budget.maxprice)}`,`- Deposit: ${money(budget.deposit)}`,`- First-time buyer: ${budget.ftb===0?"No":"Yes"}`,`- Solicitor/conveyancing budget: ${money(budget.solicitor)}`,`- Survey budget: ${money(budget.survey)}`,`- Removals/misc budget: ${money(budget.removals)}`,"","## Readiness","",`- Checklist: ${r.done}/${r.total} (${r.pct}%)`,...Object.entries(CHECKLIST_IDS).map(([group,ids])=>`- ${group}: ${ids.filter(id=>appData.checklist[id]).length}/${ids.length}`),"","## Top Properties",""];
if(!props.length)lines.push("No properties saved yet.");props.forEach((p,i)=>{const score=scoreProp(p);const intel=p.intel||{};lines.push(`### ${i+1}. ${p.address||"Unnamed property"}`);lines.push(`- Price: ${money(p.price)}`);lines.push(`- Postcode: ${p.postcode||"Not set"}`);lines.push(`- Beds: ${p.beds||"Not set"}`);lines.push(`- Status: ${p.status||"watching"}`);lines.push(`- Property score: ${score}/100`);if(intel.areaScore||intel.schoolScore||intel.transportScore){lines.push(`- Area score: ${intel.areaScore||"n/a"}/10`);lines.push(`- School score: ${intel.schoolScore||"n/a"}/10`);lines.push(`- Transport score: ${intel.transportScore||"n/a"}/10`)}if(intel.numSchools!=null)lines.push(`- Area data: ${intel.numSchools} schools, ${intel.numStations||0} stations, ${intel.numBuses||0} bus stops`);if(p.url)lines.push(`- Listing: ${p.url}`);if(p.offerNotes)lines.push(`- Offer notes: ${p.offerNotes}`);if(p.notes?.gut)lines.push(`- Gut feel: ${p.notes.gut}`);lines.push("")});
const actions=missingActions(r);lines.push("## Next Actions","");if(actions.length)actions.forEach(a=>lines.push(`- ${a}`));else lines.push("- No major missing actions from the current tracker data.");lines.push("","## Caveats","");lines.push("- School catchments must be verified with the local council.");lines.push("- Mortgage rates are indicative and should be confirmed with a broker or lender.");lines.push("- Public API data may be delayed, incomplete, or temporarily unavailable.");lines.push("- This pack supports decision-making; it is not legal, mortgage, survey or conveyancing advice.");return lines.join("\n")}
function render(){const r=readiness();const props=appData.properties||[];document.getElementById("empty").style.display=(!props.length&&!appData.budget?.maxprice)?"block":"none";document.getElementById("stats").innerHTML=`<div class="stat"><span class="muted">Properties</span><strong>${props.length}</strong></div><div class="stat"><span class="muted">Readiness</span><strong>${r.pct}%</strong></div><div class="stat"><span class="muted">Budget</span><strong>${appData.budget?.maxprice?"Set":"Open"}</strong></div>`;document.getElementById("summaryRows").innerHTML=`<div class="row"><span>Top property</span><strong>${topProperties()[0]?.address||"None"}</strong></div><div class="row"><span>Target area</span><strong>${appData.settings?.area||"Not set"}</strong></div><div class="row"><span>First-time buyer</span><strong>${appData.budget?.ftb===0?"No":"Yes"}</strong></div>`;document.getElementById("pack").value=buildPack()}
function refreshPack(){load();render()}
function copyPack(){navigator.clipboard?.writeText(document.getElementById("pack").value).then(()=>alert("Buyer pack copied."),()=>alert("Copy failed. Select the text manually."))}
function downloadPack(){const blob=new Blob([document.getElementById("pack").value],{type:"text/markdown;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="uk-home-intelligence-buyer-pack-"+new Date().toISOString().slice(0,10)+".md";a.click();URL.revokeObjectURL(url)}
refreshPack();
</script>
</body>
</html>
