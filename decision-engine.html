<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Engine - UK Home Intelligence Pro</title>
<meta name="description" content="Transparent property decision score for UK Home Intelligence Pro.">
<style>
:root{--bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd4;--border2:#ccc8be;--text:#1a1815;--muted:#6b6660;--accent:#1a5c3a;--blue:#1751a8;--warn:#8a4a00;--danger:#8b1c1c;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:1100px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:30px;margin:0}h2{font-size:16px;margin:0 0 10px}.muted{color:var(--muted)}a{color:var(--blue);text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(320px,.75fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center}.row label{font-weight:700}.row small{display:block;color:var(--muted);font-weight:400}.row input{width:100%;padding:9px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:15px}.score{font-size:56px;font-weight:900;line-height:1;margin:10px 0;color:var(--accent)}.bar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.parts{display:grid;gap:8px;margin-top:14px}.part{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;font-size:14px}.part .mini{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.part .mini span{display:block;height:100%;background:var(--blue)}.risk span{background:var(--danger)!important}.verdict{border-radius:var(--radius);padding:12px 14px;background:var(--surface2);border:1px solid var(--border);margin-top:14px}.verdict strong{display:block;margin-bottom:4px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:var(--radius);padding:10px 14px;background:var(--accent);color:white;font-weight:800;cursor:pointer}button.secondary{background:var(--blue)}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:var(--radius);font-size:12px;max-height:260px;overflow:auto}@media(max-width:820px){.grid{grid-template-columns:1fr}.part{grid-template-columns:120px 1fr 46px}.wrap{padding:14px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Decision Engine</h1>
      <div class="muted">Transparent property score for the merged UK Home Intelligence Pro workflow.</div>
    </div>
    <div class="actions">
      <a class="pill" href="./home-intelligence-pro.html">Home Intelligence Pro</a>
      <a class="pill" href="./area-intelligence.html">Area Intelligence</a>
      <a class="pill" href="./mortgage-watch.html">Mortgage Watch</a>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Inputs</h2>
      <div class="form">
        <div class="row"><label>Property manual score <small>Condition, layout, value, garden, commute and fit.</small></label><input id="property" type="number" min="0" max="100" value="72" oninput="calculate()"></div>
        <div class="row"><label>Area intelligence score <small>Crime, schools, transport, census, flood/environment evidence.</small></label><input id="area" type="number" min="0" max="100" value="68" oninput="calculate()"></div>
        <div class="row"><label>Affordability headroom <small>Budget comfort after SDLT, fees, deposit and monthly payment.</small></label><input id="affordability" type="number" min="0" max="100" value="64" oninput="calculate()"></div>
        <div class="row"><label>Mortgage timing score <small>Lock/wait signal from Mortgage Watch.</small></label><input id="mortgage" type="number" min="0" max="100" value="42" oninput="calculate()"></div>
        <div class="row"><label>Readiness score <small>AIP, solicitor, documents, checklist and offer preparedness.</small></label><input id="readiness" type="number" min="0" max="100" value="55" oninput="calculate()"></div>
        <div class="row"><label>Risk penalty <small>Missing data, flood concern, weak transport, affordability pressure. Enter 0-20.</small></label><input id="risk" type="number" min="0" max="20" value="6" oninput="calculate()"></div>
      </div>
      <div class="buttons">
        <button onclick="copyDecisionPack()">Copy decision summary</button>
        <button class="secondary" onclick="loadExample('strong')">Strong example</button>
        <button class="secondary" onclick="loadExample('risky')">Risky example</button>
      </div>
    </section>

    <section class="card">
      <h2>Decision Score</h2>
      <div class="score" id="score">--</div>
      <div class="bar"><span id="scoreBar" style="width:0%"></span></div>
      <div class="verdict" id="verdict"></div>
      <div class="parts" id="parts"></div>
    </section>
  </div>

  <section class="card" style="margin-top:14px">
    <h2>Decision object</h2>
    <pre id="decisionObject">{}</pre>
  </section>
</div>

<script>
const WEIGHTS={property:.30,area:.25,affordability:.20,mortgage:.10,readiness:.10};
let decision={};
function val(id){return Math.max(0,Number(document.getElementById(id).value)||0)}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,n))}
function calculate(){const inputs={property:clamp(val("property")),area:clamp(val("area")),affordability:clamp(val("affordability")),mortgage:clamp(val("mortgage")),readiness:clamp(val("readiness")),riskPenalty:clamp(val("risk"),0,20)};const weighted=(inputs.property*WEIGHTS.property)+(inputs.area*WEIGHTS.area)+(inputs.affordability*WEIGHTS.affordability)+(inputs.mortgage*WEIGHTS.mortgage)+(inputs.readiness*WEIGHTS.readiness);const final=clamp(Math.round(weighted-inputs.riskPenalty));decision={score:final,weightedBeforeRisk:Math.round(weighted),inputs,weights:WEIGHTS,verdict:verdict(final,inputs),generatedAt:new Date().toISOString()};render()}
function verdict(score,inputs){const flags=[];if(inputs.affordability<50)flags.push("Affordability is tight");if(inputs.area<55)flags.push("Area evidence needs review");if(inputs.mortgage<45)flags.push("Mortgage timing is not favourable");if(inputs.readiness<60)flags.push("Buyer readiness is incomplete");if(inputs.riskPenalty>=10)flags.push("Risk penalty is material");let label="Proceed only with more evidence",tone="warn";if(score>=78){label="Strong candidate";tone="good"}else if(score>=65){label="Promising, but validate the risks";tone="ok"}else if(score>=50){label="Borderline - needs negotiation or more evidence";tone="warn"}else{label="High caution";tone="bad"}return{label,tone,flags}}
function render(){document.getElementById("score").textContent=decision.score;document.getElementById("scoreBar").style.width=decision.score+"%";const color=decision.score>=78?"var(--accent)":decision.score>=65?"var(--blue)":decision.score>=50?"var(--warn)":"var(--danger)";document.getElementById("score").style.color=color;document.getElementById("scoreBar").style.background=color;document.getElementById("verdict").innerHTML=`<strong>${decision.verdict.label}</strong><span class="muted">${decision.verdict.flags.length?decision.verdict.flags.join("; "):"No major caveats from the current inputs."}</span>`;const parts=[['Property',decision.inputs.property,30],['Area',decision.inputs.area,25],['Affordability',decision.inputs.affordability,20],['Mortgage',decision.inputs.mortgage,10],['Readiness',decision.inputs.readiness,10],['Risk penalty',decision.inputs.riskPenalty,20,true]];document.getElementById("parts").innerHTML=parts.map(([name,value,weight,risk])=>`<div class="part ${risk?'risk':''}"><span>${name}</span><div class="mini"><span style="width:${risk?(value/20*100):value}%"></span></div><strong>${risk?'-'+value:value}</strong></div>`).join("");document.getElementById("decisionObject").textContent=JSON.stringify(decision,null,2)}
function copyDecisionPack(){const text=["UK Home Intelligence Pro - Decision Summary",`Score: ${decision.score}/100`,`Verdict: ${decision.verdict.label}`,`Flags: ${decision.verdict.flags.join('; ')||'None'}`,"",JSON.stringify(decision.inputs,null,2)].join("\n");navigator.clipboard?.writeText(text).then(()=>alert("Decision summary copied."),()=>alert(text))}
function loadExample(type){const examples={strong:{property:84,area:78,affordability:74,mortgage:62,readiness:82,risk:4},risky:{property:68,area:44,affordability:42,mortgage:38,readiness:50,risk:14}};const e=examples[type];Object.entries(e).forEach(([k,v])=>document.getElementById(k).value=v);calculate()}
calculate();
</script>
</body>
</html>
